<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🙏 Thank You</title>
  <style>
    body {
      background-color: black;
      color: #00ffcc;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 48px;
      color: #ff66cc;
      text-shadow: 0 0 20px #ff66cc;
      margin-bottom: 20px;
    }

    p {
      font-size: 24px;
      color: yellow;
      margin-bottom: 40px;
    }

    .thank-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 20px #00ffcc;
    }

    .thank-box p {
      font-size: 20px;
      color: #ff66cc;
      margin: 10px 0;
    }

    .btn-home {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      color: black;
      background-color: #ff66cc;
      border-radius: 25px;
      box-shadow: 0 0 15px #ff66cc;
      transition: 0.3s;
    }

    .btn-home:hover {
      background-color: #00ffcc;
      color: black;
      box-shadow: 0 0 20px #00ffcc;
    }
  </style>
</head>
<body>
  <h1>🙏 Thank You!</h1>
  <p>Your order and feedback have been successfully submitted.</p>

  <div class="thank-box">
    <p>We appreciate your feedback!</p>
    
    <a href="bill.html" class="btn-home">🏠 Back to Menu</a>
  </div>
</body>
</html>
