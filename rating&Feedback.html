<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Feedback & Order</title>
  <style>
    body {
      background-color: #000;
      color: #00ffcc;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #ff66cc;
      text-shadow: 0 0 15px #ff66cc;
    }
    .box {
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 20px #00ffcc;
      margin-top: 20px;
      width: 350px;
      text-align: left;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 18px;
      color: #ff66cc;
    }
    textarea {
      width: 100%;
      height: 100px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      font-size: 16px;
      margin-top: 5px;
      resize: none;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      background: #ff66cc;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px #ff66cc;
      transition: 0.3s;
    }
    button:hover {
      background: #00ffcc;
      color: black;
      box-shadow: 0 0 20px #00ffcc;
    }
    .order-details {
      margin-bottom: 15px;
      font-size: 18px;
      color: yellow;
    }
  </style>
</head>
<body>
  <h1>📝 Your Order & Feedback</h1>

  <div class="box">
    <!-- Display order details -->
    <div class="order-details" id="orderDetails"></div>

    <!-- Feedback form -->
    <form id="feedbackForm" onsubmit="return submitFeedback()">
      <label for="feedback">Your Feedback</label>
      <textarea id="feedback" placeholder="Write your feedback here..." required></textarea>
      <button type="submit">Submit Feedback & Finish ✅</button>
    </form>
  </div>

  <script>
    // Load order from localStorage
    const order = JSON.parse(localStorage.getItem('orderDetails'));
    const orderBox = document.getElementById('orderDetails');

    if(order){
      orderBox.innerHTML = `
        <b>🥤 Cooldrink:</b> ${order.cooldrink}<br>
        <b>🍛 Food:</b> ${order.food}<br>
        <b>🍦 Ice Cream:</b> ${order.icecream}<br>
        <b>Total:</b> ₹${order.total}
      `;
    } else {
      orderBox.innerHTML = "<b>No order found!</b>";
    }

    function submitFeedback() {
      const feedbackText = document.getElementById('feedback').value.trim();
      if(feedbackText === "") {
        alert("Please write feedback!");
        return false;
      }

      // Save feedback to localStorage
      localStorage.setItem('feedback', feedbackText);

      // Redirect to Thank You page
      window.location.href = "thankyou.html";

      return false; // prevent default form submission
    }
  </script>
</body>
</html>
