<!DOCTYPE html>
<html>
<head>
  <title>Ice Cream</title>
  <style>
    body {
      background-color: black;
      background-image: url("https://wallpapercave.com/wp/PseIHZA.jpg");
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: greenyellow;
      text-align: center;
      padding-top: 50px;
    }
    img {
      width: 300px;
      height: 300px;
      display: block;
      margin: 0 auto;
      border-radius: 15px;
    }
    .item {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
      padding: 20px;
      margin: 20px auto;
      width: 350px;
      box-shadow: 0 0 10px #444;
      text-align: center;
    }
    .item label {
      display: block;
      margin-top: 15px;
      font-size: 18px;
      color: gold;
    }
    select {
      padding: 8px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: greenyellow;
      color: black;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }
    .btn:hover {
      background: gold;
      color: black;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Ice Cream Page</h1>
  
  <form action="rating&Feedback.html" method="get">
    <div class="item">
      <img src="https://img.freepik.com/premium-photo/chocolate-vanilla-strawberry-ice-cream-isolated-white_807701-3441.jpg?w=2000" alt="Ice Cream">
      
     

      <label for="flavor">Choose Flavor:</label>
      <select name="flavor" id="flavor">
        <option value="Vanilla - ₹90">Vanilla - ₹90</option>
        <option value="Chocolate - ₹100">Chocolate - ₹100</option>
        <option value="Strawberry - ₹120">Strawberry - ₹120</option>
      </select>

      <br>
      <button type="submit" class="btn">Go to Rating & Feedback →</button>
      <form action="rating_feedback.html" method="get">

    </div>
  </form>

</body>
</html>
